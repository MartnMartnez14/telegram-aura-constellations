<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="Telegram AURA Constellations Symbol">
  <defs>
    <radialGradient id="auraBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A997DF" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#D9BC80" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#10121D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="auraGeodesicA" x1="28" y1="74" x2="54" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94BFB2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A997DF" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="auraGeodesicB" x1="54" y1="26" x2="90" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A997DF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#D9BC80" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="auraGeodesicC" x1="90" y1="66" x2="28" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9BC80" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#94BFB2" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <!-- Subtle atmospheric halo -->
  <circle cx="60" cy="60" r="52" fill="url(#auraBgGlow)" />

  <!-- Tilted elliptical orbital ring -->
  <ellipse
    cx="60"
    cy="58"
    rx="44"
    ry="27"
    transform="rotate(-21 60 58)"
    stroke="#F4F0F8"
    stroke-opacity="0.16"
    stroke-width="1.15"
    stroke-dasharray="3 4"
  />

  <!-- Outer meridian ring -->
  <circle
    cx="60"
    cy="60"
    r="48"
    stroke="#A997DF"
    stroke-opacity="0.18"
    stroke-width="1"
  />

  <!-- Fine geodesic constellation links between the three asymmetric celestial bodies -->
  <path
    d="M 28 74 Q 36 45 54 26"
    stroke="url(#auraGeodesicA)"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M 54 26 Q 77 39 90 66"
    stroke="url(#auraGeodesicB)"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M 90 66 Q 59 81 28 74"
    stroke="url(#auraGeodesicC)"
    stroke-width="1.65"
    stroke-linecap="round"
  />

  <!-- Internal subtle centroid axis -->
  <line x1="54" y1="26" x2="57" y2="57" stroke="#A997DF" stroke-opacity="0.28" stroke-width="1" />
  <line x1="90" y1="66" x2="57" y2="57" stroke="#D9BC80" stroke-opacity="0.28" stroke-width="1" />
  <line x1="28" y1="74" x2="57" y2="57" stroke="#94BFB2" stroke-opacity="0.28" stroke-width="1" />
  <circle cx="57" cy="57" r="2.2" fill="#F4F0F8" fill-opacity="0.7" />

  <!-- Celestial Body 1: Amethyst Zenith (North-Northwest) -->
  <circle cx="54" cy="26" r="11" fill="#A997DF" fill-opacity="0.2" />
  <circle cx="54" cy="26" r="6.4" fill="#A997DF" />
  <circle cx="52.2" cy="24.2" r="2" fill="#F4F0F8" fill-opacity="0.85" />

  <!-- Celestial Body 2: Champagne Gold East-Southeast -->
  <circle cx="90" cy="66" r="9.5" fill="#D9BC80" fill-opacity="0.2" />
  <circle cx="90" cy="66" r="5.4" fill="#D9BC80" />
  <circle cx="88.5" cy="64.5" r="1.7" fill="#F4F0F8" fill-opacity="0.85" />

  <!-- Celestial Body 3: Sage West-Southwest -->
  <circle cx="28" cy="74" r="8.5" fill="#94BFB2" fill-opacity="0.2" />
  <circle cx="28" cy="74" r="4.8" fill="#94BFB2" />
  <circle cx="26.7" cy="72.7" r="1.5" fill="#F4F0F8" fill-opacity="0.85" />
</svg>
